name: pintos-check

on:
  push:
    branches: [main]
    paths: ['pintos/**']
  # no paths filter: a required check must report on every PR
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      project:
        description: Pintos project to test
        type: choice
        options: [threads, userprog, vm, filesys]
        default: threads

permissions:
  contents: read
  issues: write

concurrency:
  group: pintos-check
  cancel-in-progress: false

jobs:
  check:
    # same Ubuntu release as the devcontainer
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: make check
        working-directory: pintos/${{ inputs.project || 'threads' }}
        run: |
          source ../activate
          make check

      # only after merge (push), so unmerged PR code never closes an issue
      - name: Close issues of passed tests
        if: always() && github.event_name == 'push'
        working-directory: pintos/threads/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 200 --json number,title > /tmp/issues.json
          for f in tests/threads/*.result; do
            [ "$(head -n1 "$f")" = PASS ] || continue
            t=$(basename "$f" .result)
            jq -r --arg t "$t" '.[] | select((.title | sub("\\s+$"; "")) | endswith("테스트 - " + $t)) | .number' /tmp/issues.json |
              xargs -r -n1 gh issue close --comment "pintos-check: $t PASS ($GITHUB_SHA)"
          done
